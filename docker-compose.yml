services:
  banter:
    build: .
    ports:
      - "8080:8080"
    environment:
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in the .env file}
      Admin__UserName: ${ADMIN_USERNAME:-}
      Admin__Email: ${ADMIN_EMAIL:-}
      Admin__Password: ${ADMIN_PASSWORD:-}
    volumes:
      - banter-data:/app/data
      - banter-avatars:/app/wwwroot/avatars
      - banter-uploads:/app/wwwroot/uploads
    restart: unless-stopped

volumes:
  banter-data:
  banter-avatars:
  banter-uploads:
